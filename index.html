<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-container" id="bg-container">
        <!-- Background image set dynamically -->
        <canvas id="starfield"></canvas>
        <div class="overlay"></div>
    </div>

    <main class="content-wrapper">
        <header class="top-bar">
            <button class="nasa-info-btn glass-panel-sm" id="nasa-info" aria-label="View NASA Astronomy Picture of the Day details">
                <div class="badge">NASA APOD</div>
                <p id="nasa-title" class="nasa-title">Loading image data...</p>
            </button>
            <div class="search-container">
                <form id="search-form" action="https://www.google.com/search" method="GET" role="search">
                    <input type="text" name="q" id="search-input" placeholder="Search the web... (Press '/')" class="search-input" aria-label="Search the web via Google" autofocus>
                </form>
            </div>
        </header>

        <section class="center-content">
            <div class="time-container" tabIndex="0" role="button" id="clock-btn" aria-label="Toggle 12/24 hour format">
                <h1 id="clock">00:00</h1>
                <p id="date">Loading date...</p>
            </div>
            <div class="greeting-container">
                <h2 id="greeting">Welcome, Explorer.</h2>
            </div>
        </section>

        <section class="bottom-content">
            <div class="quick-links" id="quick-links" aria-label="Quick links bookmarks">
                <!-- Links populated by JS -->
            </div>
            <button id="add-link-btn" class="glass-btn" aria-label="Add a quick link" title="Add quick link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
        </section>
    </main>

    <!-- Modal for adding links -->
    <div id="link-modal" class="modal hidden" role="dialog" aria-labelledby="modal-title" aria-modal="true">
        <div class="modal-content glass-panel">
            <h3 id="modal-title">Add Quick Link</h3>
            <form id="add-link-form">
                <label for="link-title" class="sr-only">Title</label>
                <input type="text" id="link-title" placeholder="Title (e.g. GitHub)" required autocomplete="off">
                <label for="link-url" class="sr-only">URL</label>
                <input type="url" id="link-url" placeholder="URL (https://...)" required autocomplete="off">
                <div class="modal-actions">
                    <button type="button" id="cancel-link" class="glass-btn">Cancel</button>
                    <button type="submit" class="glass-btn primary">Add Link</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for APOD info -->
    <div id="apod-modal" class="modal hidden" role="dialog" aria-labelledby="apod-modal-title" aria-modal="true">
        <div class="modal-content glass-panel apod-details">
            <div class="modal-header">
                <span class="badge">Astronomy Picture of the Day</span>
                <h3 id="apod-title">Title</h3>
                <span id="apod-date" class="apod-date-badge"></span>
            </div>
            <p id="apod-desc">Description</p>
            <div class="modal-actions">
                <button type="button" id="close-apod" class="glass-btn primary">Close</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
